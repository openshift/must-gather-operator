# Mode: Obfuscate + Upload (existing bundle on PVC, no gather)
# The source PVC is mounted read-only. Obfuscated output goes to a temporary
# volume and is uploaded via SFTP. Requires uploadTarget.
apiVersion: operator.openshift.io/v1
kind: MustGather
metadata:
  name: obfuscate-existing-bundle
spec:
  serviceAccountName: must-gather-admin
  uploadTarget:
    type: SFTP
    sftp:
      caseID: "01234567"
      caseManagementAccountSecretRef:
        name: case-management-creds
  obfuscate:
    enabled: true
    obfuscationConfigRef:
      name: my-obfuscation-rules
    source:
      claim:
        name: must-gather-pvc
      subPath: must-gather-data
