# Mode: Obfuscate Only (existing bundle on PVC, no gather)
# The cleaned output (cleaned/ directory) is written back to the same source PVC.
# No separate storage PVC is needed.
apiVersion: operator.openshift.io/v1alpha1
kind: MustGather
metadata:
  name: obfuscate-existing-bundle
spec:
  serviceAccountName: must-gather-admin
  obfuscate:
    enabled: true
    obfuscationConfigRef:
      name: my-obfuscation-rules
    source:
      claim:
        name: must-gather-pvc
      subPath: must-gather-data
